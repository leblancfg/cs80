name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the static app
        run: |
          mkdir _site
          cp web/index.html web/app.js web/perf.js web/style.css web/cs80-worklet.js web/cs80v2.wasm web/presets-library.json \
            web/favicon.svg web/favicon-32.png web/favicon.ico web/apple-touch-icon.png web/og.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
