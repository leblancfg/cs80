name: plugin
# Windows and Linux VST3 builds of plugin/, checked with pluginval.
# The macOS AU and VST3 are built on a Mac from the same tag (plugin/README.md).
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  PLUGINVAL: https://github.com/Tracktion/pluginval/releases/download/v1.0.4
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: WebView2 SDK (static loader)
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory "$env:RUNNER_TEMP\nuget"
      - name: Configure
        shell: pwsh
        run: cmake -S plugin -B build -A x64 -T ClangCL -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCS80_BUILD_TESTS=ON "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$env:RUNNER_TEMP\nuget"
      - name: Build
        run: cmake --build build --config Release --target CS80_VST3 cs80_editor_check --parallel
      - name: pluginval without the editor
        shell: pwsh
        run: |
          Invoke-WebRequest "$env:PLUGINVAL/pluginval_Windows.zip" -OutFile pv.zip
          Expand-Archive pv.zip -DestinationPath pv
          # pluginval.exe is a GUI-subsystem program, so wait for it explicitly
          $p = Start-Process -Wait -PassThru -NoNewWindow -FilePath .\pv\pluginval.exe -ArgumentList `
            '--strictness-level', '10', '--skip-gui-tests', '--validate-in-process', '--output-dir', 'pvlogs', 'build\CS80_artefacts\Release\VST3\CS80.vst3'
          Get-Content pvlogs\*.txt -Tail 3
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: pluginval with the editor
        shell: pwsh
        run: |
          $p = Start-Process -Wait -PassThru -NoNewWindow -FilePath .\pv\pluginval.exe -ArgumentList `
            '--strictness-level', '10', '--validate-in-process', '--output-dir', 'pvlogs-gui', 'build\CS80_artefacts\Release\VST3\CS80.vst3'
          Get-Content pvlogs-gui\*.txt -Tail 3
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Faceplate check (WebView2)
        # the page reports the values it gets and moves I LPF through its own
        # wheel handler, so the host should see a gesture
        shell: pwsh
        run: |
          $env:CS80_UI_SELFTEST = "1"
          $p = Start-Process -PassThru -NoNewWindow -FilePath build\cs80_editor_check_artefacts\Release\cs80_editor_check.exe `
            -ArgumentList 'build\CS80_artefacts\Release\VST3\CS80.vst3', '4', '10', '"I LPF=300"' `
            -RedirectStandardOutput ec-out.txt -RedirectStandardError ec-err.txt
          Start-Sleep -Seconds 7
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force pvlogs-faceplate | Out-Null
          $bmp.Save("pvlogs-faceplate\faceplate-windows.png")
          $p.WaitForExit()
          Get-Content ec-out.txt, ec-err.txt | Tee-Object pvlogs-faceplate\editor_check.txt
          $out = "$(Get-Content -Raw ec-out.txt)$(Get-Content -Raw ec-err.txt)"
          if ($out -notmatch 'received 109 values' -or $out -notmatch 'I LPF gesture begin') { Write-Error 'faceplate did not run'; exit 1 }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item -Recurse build\CS80_artefacts\Release\VST3\CS80.vst3 pkg\
          Copy-Item plugin\dist\INSTALL-Windows.txt pkg\INSTALL.txt
          Copy-Item LICENSE pkg\
          Compress-Archive -Path pkg\* -DestinationPath CS80-Windows-VST3.zip
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: CS80-Windows-VST3.zip
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: windows-pluginval-logs
          path: pvlogs*

  linux:
    # 22.04 keeps the glibc baseline low enough for most current distributions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev libxi-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev xvfb imagemagick
      - name: Build
        run: |
          cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCS80_BUILD_TESTS=ON
          cmake --build build --target CS80_VST3 cs80_editor_check --parallel
      - name: pluginval
        run: |
          curl -sSLo pv.zip "$PLUGINVAL/pluginval_Linux.zip" && unzip -q pv.zip -d pv
          xvfb-run -a ./pv/pluginval --strictness-level 10 --validate-in-process --output-dir pvlogs build/CS80_artefacts/Release/VST3/CS80.vst3
      - name: Faceplate check (WebKitGTK)
        run: |
          mkdir -p pvlogs
          cat > fc.sh <<'SH'
          CS80_UI_SELFTEST=1 build/cs80_editor_check_artefacts/Release/cs80_editor_check \
            build/CS80_artefacts/Release/VST3/CS80.vst3 4 10 'I LPF=300' > pvlogs/editor_check.txt 2>&1 &
          sleep 7; import -window root pvlogs/faceplate-linux.png; wait
          SH
          xvfb-run -a -s "-screen 0 1600x900x24" sh fc.sh
          cat pvlogs/editor_check.txt | grep -v Gtk-CRITICAL
          grep -q 'received 109 values' pvlogs/editor_check.txt && grep -q 'I LPF gesture begin' pvlogs/editor_check.txt
      - name: Package
        run: |
          mkdir -p pkg && cp -R build/CS80_artefacts/Release/VST3/CS80.vst3 pkg/
          cp plugin/dist/INSTALL-Linux.txt pkg/INSTALL.txt && cp LICENSE pkg/
          tar -C pkg -czf CS80-Linux-VST3.tar.gz CS80.vst3 INSTALL.txt LICENSE
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: CS80-Linux-VST3.tar.gz
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: linux-pluginval-logs
          path: pvlogs
